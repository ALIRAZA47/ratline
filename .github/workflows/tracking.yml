# Gates the build on a valid tracker (brief §2.3, task RL-M0-025).
#
# This runs from M0 onward, before any application code exists, because a
# malformed tracker is a build failure in its own right. The full CI pipeline
# (lint, typecheck, tests, coverage gates) arrives with RL-M1-002 and writes the
# metrics that STATUS.md reports.

name: tracking

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Schema, enum, ID format, dangling references, depends_on/blocks
      # symmetry, dependency cycles, and the brief §2.2 rules. Non-zero exit
      # fails the build.
      - name: tasks validate
        run: ./scripts/tasks validate

      # STATUS.md is generated. If rendering changes it, someone hand-edited it
      # or forgot to re-render at the end of a session.
      - name: STATUS.md is current
        run: |
          ./scripts/tasks render
          if ! git diff --quiet -- docs/STATUS.md; then
            echo "::error::docs/STATUS.md is stale or was hand-edited."
            echo "Run './scripts/tasks render' and commit the result."
            git --no-pager diff -- docs/STATUS.md
            exit 1
          fi

      # `tasks done` refuses to close a task without this file reporting green.
      # Written last so it only appears when everything above passed.
      - name: Record CI status
        if: success()
        run: |
          mkdir -p .ratline
          printf '{"status":"green","commit":"%s","at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ratline/ci-status.json

      - name: Upload CI status
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status
          path: .ratline/ci-status.json
          retention-days: 30
