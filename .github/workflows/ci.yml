# Ratline CI (RL-M1-002).
#
# Supersedes the M0 tracking-only workflow, which ran `tasks validate` on its
# own. Both checks live here now so there is exactly one place that decides
# whether a commit is green, and exactly one place that writes the status file
# the `tasks done` gate reads.
#
# The tracker job runs independently of the code job: a malformed tracker fails
# the build on its own merits (brief §2.3), and a red test suite does not hide a
# stale tracker or vice versa.

name: ci

on:
  # Push only, deliberately (RL-M1-048). A `pull_request:` trigger alongside this
  # one meant every push to a branch with an open PR started TWO full pipelines —
  # `github.ref` differs between the two events, so the concurrency group below
  # does not collapse them, and neither cancels the other.
  #
  # What that trigger buys is a run against the branch merged into main, which is
  # a genuinely different question from "does the branch pass". It is not worth
  # paying for on every push here, because main carries this same workflow: a
  # merge that breaks it is caught by main's own run within a minute, not never.
  #
  # RESTORE `pull_request:` IF THIS REPOSITORY EVER TAKES OUTSIDE CONTRIBUTIONS.
  # A push from a fork does not trigger a workflow in this repository, so a fork's
  # pull request would arrive with no CI at all — and unlike the merge-result
  # question, that gap is silent.
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracker:
    name: Tracker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Schema, enums, ID format, dangling references, depends_on/blocks
      # symmetry, dependency cycles, and the brief §2.2 rules.
      - name: tasks validate
        run: ./scripts/tasks validate

      # STATUS.md is generated and must never be hand-edited. --check compares
      # only the tracker-derived sections; test health, security findings and
      # build status legitimately change every run and are excluded, or this
      # would fail for the wrong reason on every commit.
      - name: STATUS.md is current
        run: ./scripts/tasks render --check

  # Does any dependency have a published hole? (RL-M1-060)
  #
  # Its own job rather than a step in `code`, for two reasons. It is the one check
  # here whose answer changes without the repository changing — an advisory
  # published tomorrow turns today's commit red on its next run — so it should not
  # be able to mask, or be masked by, a test result. And it needs the registry
  # while nothing else in `code` does, so a network failure names itself instead of
  # arriving as "lint, typecheck, test" having failed.
  #
  # It fails on a PRODUCTION advisory only. Development advisories print in full
  # and pass; see scripts/dependency_audit.ts for the argument, which is short: a
  # red pipeline nobody can act on trains people to ignore the check, and an
  # ignored check occupies the space a working one would go in.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # No `npm ci`. `npm audit` reads package-lock.json and asks the registry, so
      # installing 137 packages first would buy nothing — and this job's whole
      # subject is the lockfile rather than the tree it produces.
      - name: Dependency audit
        run: ./scripts/audit-deps

  code:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    # A real Postgres, for the same reason the migration job has one. Without it
    # every database-backed suite SKIPS — and the first run of this workflow
    # proved what that costs: 320 of 592 tests passed, the authorization matrix
    # reported "did not run, it is NOT green, it is unknown", and both coverage
    # gates refused at 71%. The gates were right and the workflow was wrong.
    #
    # Skipping is the dangerous shape here, not failing. `test/support/db.ts`
    # skips only when DATABASE_URL is UNSET and throws when it is set and
    # unreachable, precisely so a pipeline cannot report a green security suite
    # that never touched a database. Setting it below turns any future
    # connection problem into a loud failure instead of a quiet skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ratline
          POSTGRES_PASSWORD: ratline
          POSTGRES_DB: ratline_test
          # Matches local development, and that is the point rather than a
          # convenience. The fixtures connect as `ratline_app` with no password —
          # migration 2 creates it NOLOGIN and passwordless deliberately, because
          # a login role with a shipped password is the default credential C4
          # forbids — so under scram-sha-256 every authorization suite fails to
          # connect while the unit tests pass, which is what the second CI run
          # showed: 374 of 592, and the matrix reporting "unknown".
          #
          # Giving the role a password for CI only would make the pipeline test a
          # configuration production never uses. Trust here keeps "passes
          # locally" and "passes in CI" the same claim. It is safe in a way it
          # would not be anywhere else: an ephemeral container, on loopback,
          # inside one job, destroyed with it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suites create a scratch DATABASE per test, so this role needs
      # CREATEDB — the postgres image makes POSTGRES_USER a superuser, which
      # covers it and also covers the one `alter role ratline_app login` the
      # fixtures perform. The APPLICATION still connects as the unprivileged
      # ratline_app; a superuser bypasses row-level security unconditionally, so
      # using it for the assertions would make every isolation test vacuous.
      DATABASE_URL: postgres://ratline:ratline@127.0.0.1:5432/ratline_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Writes .ratline/metrics.json and .ratline/security-findings.json, which
      # `tasks render` reports in STATUS.md. Exits non-zero if any test failed.
      #
      # Integration tests are NOT run here: brief §6.7 forbids mocking anything
      # that touches a host, and no host is available. See RISKS.md R-01. They
      # run via `./scripts/ci-metrics --integration` once RL-M2-024 lands, and
      # metrics.json says plainly that they were not run rather than omitting it.
      - name: Test and collect metrics
        run: ./scripts/ci-metrics

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: .ratline/
          retention-days: 30

  database:
    name: Migrations up, down, up
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. Brief §9 forbids mocking the thing under
    # test, and a migration runner tested against a fake proves nothing about
    # whether the SQL applies.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ratline
          POSTGRES_PASSWORD: ratline
          POSTGRES_DB: ratline_test
          # Matches local development, and that is the point rather than a
          # convenience. The fixtures connect as `ratline_app` with no password —
          # migration 2 creates it NOLOGIN and passwordless deliberately, because
          # a login role with a shipped password is the default credential C4
          # forbids — so under scram-sha-256 every authorization suite fails to
          # connect while the unit tests pass, which is what the second CI run
          # showed: 374 of 592, and the matrix reporting "unknown".
          #
          # Giving the role a password for CI only would make the pipeline test a
          # configuration production never uses. Trust here keeps "passes
          # locally" and "passes in CI" the same claim. It is safe in a way it
          # would not be anywhere else: an ephemeral container, on loopback,
          # inside one job, destroyed with it.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # Acceptance 2 (RL-M1-003). Applying up then down then up is the only way
      # to know a down path works rather than merely exists: a down that drops
      # the wrong object, or leaves state behind, only shows up on the second up.
      - name: Migration cycle
        run: ./scripts/migrate cycle
        env:
          DATABASE_URL: postgres://ratline:ratline@127.0.0.1:5432/ratline_test

      - name: Integration tests
        run: ./scripts/ci-metrics --integration
        env:
          DATABASE_URL: postgres://ratline:ratline@127.0.0.1:5432/ratline_test

  agent:
    name: Agent binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

        # fetch-depth: 0 is not needed, but the checkout must be a real
        # repository rather than an exported tree: Go stamps the commit into main
        # packages from the VCS state, and agent/internal/build's artifact test
        # asserts a 40-character revision landed. An export would fail it —
        # correctly, because a binary built that way is unattributable (C6).

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          # No module cache key needed: the module has no dependencies, and a
          # test asserts it stays that way. If caching ever becomes worthwhile
          # here, that is the signal something was added.
          cache: false

      # Acceptance 2 of RL-M2-001. `verify` is gofmt, go vet, go test, and a
      # reproducibility check that builds the same tree twice and compares the
      # bytes — the claim ADR 0002's checksum-before-execute bootstrap depends
      # on. Running the script rather than inlining the steps keeps CI and a
      # developer's terminal executing the same checks in the same order.
      # Node as well as Go, because the drift check reads the TypeScript catalogue
      # that generates the agent's copy of it.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Acceptance 2 of RL-M2-002. A generator makes the two sides agree when
      # somebody remembers to run it; this is what makes "cannot drift" true. A
      # stale copy here means the control plane signs instructions the agent
      # refuses, which would present as a broken host rather than as a stale file.
      - name: Catalogue is not stale
        run: ./scripts/gen-agent-protocol --check

      - name: Verify
        run: ./scripts/agent verify

      # Acceptance 1. The test above already parses the ELF headers, so this is
      # the release path rather than the verification: it proves the shipping
      # build works on a clean runner and publishes the artefacts with their
      # checksums.
      - name: Release build
        run: ./scripts/agent build "0.0.0-ci.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-binaries
          path: agent/dist/
          if-no-files-found: error

  status:
    name: Record CI status
    runs-on: ubuntu-latest
    needs: [tracker, audit, code, database, agent]
    if: success()
    steps:
      - uses: actions/checkout@v4

      # `tasks done` refuses to close a task unless this file reports green.
      # It is written only when EVERY job above succeeded, so "green" means the
      # whole pipeline, not one step of it. Nothing outside CI writes this file —
      # a local run that minted its own green light would defeat the gate.
      #
      # "Every job" is five now: RL-M1-060 added `audit`. The count is deliberately
      # not written into the sentence any more, because the previous version said
      # "ALL FOUR" and the next person to add a job has to notice a number in a
      # comment as well as the list below.
      #
      # Adding a job means adding it to `needs` as well. Forgetting to would not
      # break anything visibly: the pipeline would still go green, while quietly
      # no longer waiting for the new job's result.
      - name: Write ci-status.json
        run: |
          mkdir -p .ratline
          printf '{"status":"green","commit":"%s","at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ratline/ci-status.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-status
          path: .ratline/ci-status.json
          retention-days: 30
