- id: RL-M7-007
  title: Derive database and user identifiers rather than accepting them
  milestone: M7
  status: todo
  owner: agent
  estimate: L
  depends_on: [RL-M7-006]
  blocks: [RL-M7-008]
  risk: high
  acceptance:
    - The operator supplies a label and Ratline derives the identifier; a label never becomes an identifier verbatim
    - Every derived identifier is validated against a strict pattern before use and quoted with the engine's own quoting function
    - A fuzz test pushes SQL metacharacters, unicode normalisation forms and reserved words through every label field reaching a DDL statement
    - An escape is treated as a critical finding rather than a bug
  artifacts:
    - test/security/database_identifier_fuzz.test.ts
  decisions: [13]
  notes: |
    2026-08-02 — The one place C2's answer does not transfer. SQL DDL cannot
    parameterise identifiers — CREATE DATABASE $1 is not valid — so the name is
    interpolated into statement text by necessity. Deriving it ourselves is what
    replaces the argv array.

