- id: RL-M1-034
  title: Add an administrative password reset action to the catalogue
  milestone: M1
  status: done
  owner: agent
  estimate: M
  depends_on: [RL-M1-017]
  blocks: []
  risk: high
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - Resetting another member's password is a catalogued action that only Owner and Admin hold
    - The reset is audited with the actor, and never records the new value
    - Every session belonging to that member is revoked by the reset
  artifacts:
    - test/authz/password_reset_permission.test.ts
  decisions: [14]
  notes: |
    2026-08-02 — RL-M1-017 shipped updatePasswordHash refusing non-self writes
    rather than an ungated administrative reset, which is the right refusal but
    leaves a real gap: an operator whose colleague has lost access has no route.
    Recorded as threat-model R-17.
    2026-08-02 — A password reset is not an access grant, it is an ACCOUNT TRANSFER. Between the reset and the member's next sign-in the operator holds a working credential for somebody else, and every audit entry written with it names that person. No arrangement of the function fixes that — the three acceptance criteria are the bounding of it, not three unrelated requirements: hold the action narrowly, put the transfer on the record before the credential can be used, and sign the member out so they notice. Two-factor (RL-M1-019) is the real mitigation; R-17 stays open until it lands.
    2026-08-02 — One writer, not two. RL-M1-017's updatePasswordHash gained the permission check rather than growing an administrative sibling — two paths writing the same column is how one of them ends up without the check. Self-writes stay ungated: a person changing their own password exercises authority over nobody, and gating it would mean an account whose grants were stripped could not be secured by the person holding it.
    2026-08-02 — The ordering is the OPPOSITE of setOwnPassword, and a test found out why. Copying its revoke-first order meant an Infrastructure operator — who holds member.revoke_sessions but not member.reset_password — ENDED a member's sessions on the way to being refused: a refusal with an effect, and an unaudited one, since the only entry written said the reset was denied. The write goes first because the write is where the permission is resolved, so a denial happens before anything has happened.
    2026-08-02 — Because the write now precedes the revocation, the third acceptance criterion depends on the resetter also holding member.revoke_sessions. That implication is pinned by a test rather than left to the role lists agreeing by luck — a role with one and not the other would reset passwords, leave sessions alive, and still report success.
    2026-08-02 — Mutation-tested six ways, all caught: Developer gaining the action (3 tests), non-self writes ungated again (1), sessions not revoked (2), the new password reaching the audit metadata (1), the refusal not being audited (5), and the revoke-first ordering restored (1).
    2026-08-02 — Not asserted: that the password's LENGTH is absent from the audit row. A row carrying timestamps, a sequence number and two base64url digests contains almost every small integer, so the check would pass or fail by coincidence — worse than no check, because it reads like one.
    2026-08-02 — closed without CI verification: CI has never executed — no remote yet (RISKS.md R-10). 414 tests green locally; six mutations all caught.
  acceptance_met: [1, 2, 3]
- id: RL-M1-035
  title: Decide whether sessions need an idle timeout
  milestone: M1
  status: done
  owner: agent
  estimate: S
  depends_on: []
  blocks: []
  risk: medium
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - The decision is recorded as an ADR with the options considered and the reason each was rejected
    - The residual risk of whichever way it goes is recorded in the threat model
    - Whatever replaces or supplements it exists as a task rather than as a sentence in the ADR
  artifacts:
    - docs/decisions/0017-session-idle-timeout.md
  decisions: [17]
  notes: |
    2026-08-02 — Decided: no idle timeout in v1. ADR 0017 proposed. The scenario an idle timeout is bought for is narrow and specific — an operator walks away from an unlocked workstation — and it is the only one, because a stolen token is what revocation, rotation on privilege change and the absolute eight-hour lifetime already answer.
    2026-08-02 — The decisive point is that last_seen_at records the last REQUEST, not the last human. A dashboard that polls for deploy status or host health writes it on a timer, so an idle timeout built on it would expire a session only when the tab is CLOSED — which the absolute lifetime already covers — and never for the abandoned-but-open tab, which is the entire scenario. A control whose measurement is produced by the thing it is meant to constrain is not a control, and shipping one is worse than shipping nothing, because an operator who believes the console signs itself out locks their screen less often.
    2026-08-02 — Instead: the absolute lifetime becomes configurable through the security policy that organization.manage_security_policy and PUT /organization/security-policy already exist for — the honest version of 'sign me out sooner', because it is measured on something the server actually knows. And RL-M1-037 proposes re-authentication for the highest-risk actions, which is not defeated by polling and binds the check to the moment of danger.
    2026-08-02 — Two-factor authentication does not help the walked-away case — it has already passed both factors — which is worth stating so RL-M1-019 is not mistaken for a mitigation of this.
    2026-08-02 — closed without CI verification: A decision task: the artifact is ADR 0017, proposed and awaiting the human owner (§2.6). No code, so nothing for CI to run.
  acceptance_met: [1, 2, 3]
- id: RL-M1-036
  title: Close the audit event namespace so a typo cannot vanish
  milestone: M1
  status: todo
  owner: agent
  estimate: S
  depends_on: []
  blocks: []
  risk: medium
  acceptance:
    - Audit entries name their action and resource type from a closed set, the way the permission catalogue is closed
    - An event outside that set fails a test rather than being written
    - Permission actions and non-permission events are distinguishable, so the audit viewer can enumerate both
  artifacts: []
  decisions: []
  notes: |
    2026-08-02 — Found while reviewing RL-M1-021. guardCsrf audits with action 'session.csrf_rejected' and resourceType 'session', neither of which the permission catalogue declares — and neither the type system nor the database objects, because AuditRecord types both as string and audit_entries has no check constraint. That is correct as a decision (a CSRF rejection is an event, not a permission) and unpoliced as a mechanism: a typo like 'sesion.csrf_rejected' writes cleanly and the entry disappears from every filter that looks for the real name.

    2026-08-02 — Adding 'session' to RESOURCE_TYPES is NOT the fix — catalogue_completeness rejects a resource type no action touches, which is the right rule. The audit namespace needs to be its own closed set, related to the catalogue but not identical to it.
