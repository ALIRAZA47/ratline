    2026-08-02 — The requirement is not that the two responses match, it is that there is only ONE response. Two code paths producing identical bytes today are still two code paths, and one of them grows a helpful message. So the wire response is a single frozen constant, Refusal is branded like AuthzContext so no other module can construct one, and refuse() returns the response AND the audit record together — you cannot obtain the refusal without producing the entry that says what really happened.

