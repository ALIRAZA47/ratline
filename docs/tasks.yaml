  notes: |
    2026-08-03 — The gate is a single-use token on the server's filesystem, not 'the database is empty'. That second option is unavailable and C3 is why: a context is bound to one tenant, so a bound context cannot see whether any OTHER organization exists. Reaching around it would mean a SECURITY DEFINER function or a privileged connection counting rows the application is not meant to see — a hole in C3 opened for a convenience, and one that stays open.

    2026-08-03 — The token is the better gate anyway, not merely the available one. It makes the authority to claim an installation HOST ACCESS rather than network access: whoever can read the secrets directory already owns the box, and whoever cannot should not be able to claim it by being first to reach the port. It also gets right the case the empty-database gate gets wrong in the dangerous direction — a database that is not empty but was never claimed.
    2026-08-03 — Two files, not one. Deleting the token alone would let the next boot mint a fresh one and reopen the endpoint — the vulnerability with extra steps — so a spent marker is written and 'claimed' is derived from THAT, never from the token's absence. The marker is written BEFORE the token is removed, so a crash between them leaves the installation claimed with a stale token file, which is refused. The other order leaves it unclaimed with no token, and the next boot reopens it.
    2026-08-03 — How the INSERT gets past row-level security without a hole in it: organizations carries with check (id = current_tenant()), so the id is GENERATED IN THE APPLICATION, bound as the tenant, then inserted explicitly. Nothing runs as a privileged role, nothing is SECURITY DEFINER, and the connection is the same NOBYPASSRLS ratline_app. An installation with a hundred organizations is still invisible to that transaction; it can write exactly one row, the one whose id it chose.
    2026-08-03 — Acceptance 2 is structural rather than checked: scoped() is one transaction, so the organization, user, membership and owner grant commit together or not at all. A sequence of four calls would have had three windows, and a crash in any of them leaves an installation that can NEVER be claimed — an organization exists so a second attempt is refused, and nobody can sign in to it. Mutation testing confirmed: four separate transactions fails the part-way test.
    2026-08-03 — C6's hardest case, answered rather than dodged: the actor of the claim is the owner being created. Circular on paper, truthful in fact — the operator claimed the installation and created themselves — and it means the audit entry names a person rather than 'the system', which is the one word C6 forbids. contextForBootstrap lives with the other context constructors because that is where 'every context names an actor' is enforced.
    2026-08-03 — An existing C3 test refused my first shape. createInstallation(input) took no AuthzContext, and scoped_repository has NO exemption mechanism for that rule — correctly, because an escape hatch on 'every repository function is scoped' is the one thing that would make it advisory. So the identities moved to contextForBootstrap and the function takes ctx first, which is better design as well: a repository writes rows for a context it was given rather than minting identities.
    2026-08-03 — Every bootstrap refusal is byte-identical — already claimed, never minted, wrong value. 'Already claimed' is precisely the answer an attacker wants, because it says the installation is live and worth attacking. The one exception is form validation, and it is safe: those are the operator's own typos on a form only they can reach, and §291 asks errors to state what broke and what to do next.
    2026-08-03 — Copy per §291, tested rather than asserted by eye: every problem is a sentence, none contains sorry, oops, invalid, error or failed, the slug message describes the shape rather than showing a regex, and the password message says what to do — a passphrase of four words — not only what is wrong. The sign-in form shows ONE message for every cause, because §6.3 requires an unknown account and a wrong password to be indistinguishable and a helpful form would be the account oracle.
    2026-08-03 — Verified in a real browser: both screens render, the display face is the Expanded instance, all seven controls on the claim form are reachable in form order with a visible --hemp ring at 2px offset, and every input has a label. The Entry component falls back to the sign-in form when it cannot reach the server, which is what the dev server showed — failing closed there is useless on a fresh install and harmless on a live one, where the other way round invites a claim attempt.
