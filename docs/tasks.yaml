- id: RL-M1-034
  title: Add an administrative password reset action to the catalogue
  milestone: M1
  status: done
  owner: agent
  estimate: M
  depends_on: [RL-M1-017]
  blocks: []
  risk: high
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - Resetting another member's password is a catalogued action that only Owner and Admin hold
    - The reset is audited with the actor, and never records the new value
    - Every session belonging to that member is revoked by the reset
  artifacts:
    - test/authz/password_reset_permission.test.ts
  decisions: [14]
  notes: |
    2026-08-02 — RL-M1-017 shipped updatePasswordHash refusing non-self writes
    rather than an ungated administrative reset, which is the right refusal but
    leaves a real gap: an operator whose colleague has lost access has no route.
    Recorded as threat-model R-17.
    2026-08-02 — A password reset is not an access grant, it is an ACCOUNT TRANSFER. Between the reset and the member's next sign-in the operator holds a working credential for somebody else, and every audit entry written with it names that person. No arrangement of the function fixes that — the three acceptance criteria are the bounding of it, not three unrelated requirements: hold the action narrowly, put the transfer on the record before the credential can be used, and sign the member out so they notice. Two-factor (RL-M1-019) is the real mitigation; R-17 stays open until it lands.
    2026-08-02 — One writer, not two. RL-M1-017's updatePasswordHash gained the permission check rather than growing an administrative sibling — two paths writing the same column is how one of them ends up without the check. Self-writes stay ungated: a person changing their own password exercises authority over nobody, and gating it would mean an account whose grants were stripped could not be secured by the person holding it.
    2026-08-02 — The ordering is the OPPOSITE of setOwnPassword, and a test found out why. Copying its revoke-first order meant an Infrastructure operator — who holds member.revoke_sessions but not member.reset_password — ENDED a member's sessions on the way to being refused: a refusal with an effect, and an unaudited one, since the only entry written said the reset was denied. The write goes first because the write is where the permission is resolved, so a denial happens before anything has happened.
    2026-08-02 — Because the write now precedes the revocation, the third acceptance criterion depends on the resetter also holding member.revoke_sessions. That implication is pinned by a test rather than left to the role lists agreeing by luck — a role with one and not the other would reset passwords, leave sessions alive, and still report success.
    2026-08-02 — Mutation-tested six ways, all caught: Developer gaining the action (3 tests), non-self writes ungated again (1), sessions not revoked (2), the new password reaching the audit metadata (1), the refusal not being audited (5), and the revoke-first ordering restored (1).
    2026-08-02 — Not asserted: that the password's LENGTH is absent from the audit row. A row carrying timestamps, a sequence number and two base64url digests contains almost every small integer, so the check would pass or fail by coincidence — worse than no check, because it reads like one.
    2026-08-02 — closed without CI verification: CI has never executed — no remote yet (RISKS.md R-10). 414 tests green locally; six mutations all caught.
  acceptance_met: [1, 2, 3]
- id: RL-M1-035
  title: Decide whether sessions need an idle timeout
  milestone: M1
  status: done
  owner: agent
  estimate: S
  depends_on: []
  blocks: []
  risk: medium
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - The decision is recorded as an ADR with the options considered and the reason each was rejected
    - The residual risk of whichever way it goes is recorded in the threat model
    - Whatever replaces or supplements it exists as a task rather than as a sentence in the ADR
  artifacts:
    - docs/decisions/0017-session-idle-timeout.md
  decisions: [17]
  notes: |
    2026-08-02 — Decided: no idle timeout in v1. ADR 0017 proposed. The scenario an idle timeout is bought for is narrow and specific — an operator walks away from an unlocked workstation — and it is the only one, because a stolen token is what revocation, rotation on privilege change and the absolute eight-hour lifetime already answer.
    2026-08-02 — The decisive point is that last_seen_at records the last REQUEST, not the last human. A dashboard that polls for deploy status or host health writes it on a timer, so an idle timeout built on it would expire a session only when the tab is CLOSED — which the absolute lifetime already covers — and never for the abandoned-but-open tab, which is the entire scenario. A control whose measurement is produced by the thing it is meant to constrain is not a control, and shipping one is worse than shipping nothing, because an operator who believes the console signs itself out locks their screen less often.
    2026-08-02 — Instead: the absolute lifetime becomes configurable through the security policy that organization.manage_security_policy and PUT /organization/security-policy already exist for — the honest version of 'sign me out sooner', because it is measured on something the server actually knows. And RL-M1-037 proposes re-authentication for the highest-risk actions, which is not defeated by polling and binds the check to the moment of danger.
    2026-08-02 — Two-factor authentication does not help the walked-away case — it has already passed both factors — which is worth stating so RL-M1-019 is not mistaken for a mitigation of this.
    2026-08-02 — closed without CI verification: A decision task: the artifact is ADR 0017, proposed and awaiting the human owner (§2.6). No code, so nothing for CI to run.
  acceptance_met: [1, 2, 3]
- id: RL-M1-036
  title: Close the audit event namespace so a typo cannot vanish
  milestone: M1
  status: done
  owner: agent
  estimate: S
  depends_on: []
  blocks: []
  risk: medium
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - Audit entries name their action and resource type from a closed set, the way the permission catalogue is closed
    - An event outside that set fails a test rather than being written
    - Permission actions and non-permission events are distinguishable, so the audit viewer can enumerate both
  artifacts:
    - src/authz/audit_events.ts
    - test/security/audit_namespace.test.ts
  decisions: []
  notes: |
    2026-08-02 — Found while reviewing RL-M1-021. guardCsrf audits with action 'session.csrf_rejected' and resourceType 'session', neither of which the permission catalogue declares — and neither the type system nor the database objects, because AuditRecord types both as string and audit_entries has no check constraint. That is correct as a decision (a CSRF rejection is an event, not a permission) and unpoliced as a mechanism: a typo like 'sesion.csrf_rejected' writes cleanly and the entry disappears from every filter that looks for the real name.

    2026-08-02 — Adding 'session' to RESOURCE_TYPES is NOT the fix — catalogue_completeness rejects a resource type no action touches, which is the right rule. The audit namespace needs to be its own closed set, related to the catalogue but not identical to it.
    2026-08-02 — Closed as its own set rather than by extending the catalogue, because catalogue_completeness is right to reject the alternative: every catalogued action must be carried by a role and every resource type must have an action. A CSRF rejection is exactly the kind of action nobody should hold, and forcing it into a role to satisfy completeness would put a meaningless permission in the role editor. So AUDIT_EVENTS is related to the catalogue and not identical to it, and AuditAction is the union.
    2026-08-02 — Why a typo here is worse than it sounds: an audit log is read exactly once, during an incident, by somebody searching for a specific name. A misspelled action does not degrade the log — it removes the entry from the only view anyone will ever take of it. The row is still there and it is invisible, which is the failure mode that looks like nothing happened.
    2026-08-02 — Typing AuditRecord.action immediately caught a fake name in MY OWN RL-M1-026 test: it built action as resourceType + '.read', and secret.read does not exist because §6.3 splits it into read_name and read_value. That invented name had been flowing into an audit record nobody could have searched for.
    2026-08-02 — 'session' is an audit-only resource type, not a catalogue one, because there is no session.* permission — signing somebody else out is member.revoke_sessions, a member action. A test asserts the two vocabularies stay disjoint and that session gains a permission only by MOVING to RESOURCE_TYPES rather than being duplicated.
    2026-08-02 — Mutation-tested four ways, all caught. The interesting one: a misspelled event smuggled in by a cast was caught by the declared-and-used test rather than by the cast scan, which was luck — the scan looked for a cast written inline at an action: property and the real case is a named constant. Broadened it to look for the TYPE NAME wherever the cast appears, and re-ran the mutation; now caught by both.
    2026-08-02 — closed without CI verification: CI has never executed — no remote yet (RISKS.md R-10). 518 tests green locally; four mutations all caught.
  acceptance_met: [1, 2, 3]
- id: RL-M1-037
  title: Require re-authentication for the highest-risk actions
  milestone: M1
  status: done
  owner: agent
  estimate: M
  depends_on: []
  blocks: []
  risk: high
  started_at: 2026-08-02
  done_at: 2026-08-02
  acceptance:
    - A named set of actions requires the password again when the session is older than a short threshold
    - The set and the threshold are part of the organization security policy, not hardcoded
    - A re-authentication, and a failed one, are both audited
    - The check lives with the action, not in a route handler, so a second caller cannot skip it
  artifacts:
    - src/repo/reauthentication.ts
    - test/security/reauthentication.test.ts
  decisions: [17]
  notes: |
    2026-08-02 — Proposed by ADR 0017 as the control an idle timeout was reaching for. Targets the moment of danger rather than a clock, and unlike an idle timeout it is not defeated by the dashboard's own polling. Candidate actions: secret.read_value, terminal.open, grant.create, role.update, host.create.
    2026-08-02 — The check lives in require(), which is acceptance 4 taken literally. Every repository function that gates on a permission already comes through that line, so a sensitive action cannot be reached without passing the freshness check — including by a caller written next year who has never heard of this feature. A guard the caller has to remember is a guard the second caller forgets, which is §9's argument about handlers applied one layer along.
    2026-08-02 — can() deliberately does NOT check freshness. It answers 'may this actor do this', which is what the role editor's live preview and the navigation rail ask; neither should demand a password, and a check inside can() would make the whole interface unusable the moment an organization turned this on. require() answers 'may they, right now, on this session'.
    2026-08-02 — Permission is resolved BEFORE freshness, and the ordering is not cosmetic. An actor who does not hold the action must be refused as not holding it, never asked to prove a password they would then have proved for nothing — and asking first would make the prompt an oracle, because 'you were asked to re-authenticate' would mean 'you hold this permission'.
    2026-08-02 — Fails closed on an unknown session. A job, a migration or a service identity cannot prove freshness, and 'we cannot tell' is not a reason to assume recent. The remedy for a job that legitimately needs a listed action is a policy that does not list it, never a hole here.
    2026-08-02 — Off by default — the opposite of most security defaults, and deliberate. Re-authentication nobody configured would lock operators out of a fresh installation, which is a worse first run than a control not yet switched on. The interface recommends the set; the database does not presume it.
    2026-08-02 — Two findings from my own tests. repository_gating (RL-M1-043) caught markAuthenticated taking ANY session id — it moves the timestamp that grants privilege, so unscoped it would let anyone reachable hand a stale session its privileges back. Scoped to ctx.actor.id in the statement, because there is no permission that should allow it: proving a password is something only its owner can do. And migration 10 note 3 warned that reading the sessions TABLE rather than live_sessions is 'the single mistake that would honour a revoked session' — I made it anyway, in a function about privilege.
    2026-08-02 — Mutation-tested five ways. Four caught immediately; the fifth escaped and the escape was the useful one. Reading the table instead of the view passed, because the revoked session in that test was ALSO stale by age — the test asserted the right thing for the wrong reason. Rewritten to revoke a session that is fresh by age and dead by revocation, which is the only combination that can tell the two apart, then re-ran the mutation.
    2026-08-02 — closed without CI verification: CI has never executed — no remote yet (RISKS.md R-10). 581 tests green locally; five mutations, four caught and the fifth exposed a test that could not fail.
  acceptance_met: [1, 2, 3, 4]
