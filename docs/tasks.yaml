    2026-08-03 — Three hypotheses eliminated with evidence, which is what the sample did buy. (1) Not query cost: a bare scoped() call is 0.8ms, fifty cost 39ms. (2) Not a leaked fallback pool: tracing every pool creation shows one per test, each against its own scratch database, none against process.env.DATABASE_URL. (3) Not slow teardown: pool.end() reports 0ms with idle=0, total=0 and waiting=0, so every client is released.
    2026-08-03 — It IS caused by the freshness check, though — that part holds. Short-circuiting checkFreshness took the file from 205s to 3.3s in the same conditions. So the extra call is the trigger and something contended is the cost. The remaining suspect is lock contention rather than work: asApplicationRole runs 'alter role ratline_app login', which is cluster-wide, and every usingScratch calls it; with the whole suite running file processes concurrently, an extra transaction per permission check widens the window in which they collide.
    2026-08-03 — Next step is measurement, not a fix: four full-suite runs timed to get a distribution rather than a sample. A fix chosen against one number would be tuning for an outlier.
    2026-08-03 — RESOLVED, and there was no regression. Four timed full-suite runs: 75.8s, 75.5s, 75.3s, 84.7s — the same baseline the suite always had. The 1,481,697 ms run and the 205s file run were both artefacts of MY OWN measurement, not of the code.
    2026-08-03 — The mechanism, which is worth writing down because it will happen again. Both slow measurements were taken immediately after a Bash command that had been KILLED by a ten-minute timeout. Killing 'node --test' does not kill the per-file child processes it spawned; they keep running and keep hammering Postgres. So both numbers were measured while my own orphans were competing for the same database. pgrep confirms none survive now, and the distribution is flat.
    2026-08-03 — What I got wrong, in order: I reported a 20x regression from ONE sample; when three more samples contradicted it I called it high variance, which was also wrong; the distribution says there is no variance worth naming. Two corrections to reach 'nothing is wrong'. The rule this earns: after a killed test command, check for orphaned processes BEFORE trusting the next timing — and never characterise a trend from a single sample, which is the same discipline I had been applying to flakes all session and dropped the moment the subject was performance.
    2026-08-03 — Not closed as invalid, because two real things came out of it. The freshness check does add one transaction per gated permission check — measured at 0.8ms, so it is a real cost and a known one rather than a surprise later. And three hypotheses about pool lifecycle were eliminated with evidence: no fallback pool is ever created, every pool is per-scratch-database, and pool.end() drains fully at 0ms. That is a cleaner bill of health for scoped() than existed before.
