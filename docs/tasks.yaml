- id: RL-M2-003
  title: Implement the signed instruction envelope
  milestone: M2
  status: done
  owner: agent
  estimate: L
  depends_on: [RL-M2-002]
  blocks: [RL-M2-004, RL-M2-007]
  risk: high
  started_at: 2026-08-04
  done_at: 2026-08-04
  acceptance:
    - Envelopes carry operation, typed arguments, nonce, issue time, expiry and target host identity
    - Signature verification happens before any argument is interpreted
    - An envelope addressed to another host is refused
    - An expired or replayed envelope is refused
  artifacts:
    - agent/internal/protocol/envelope_security_test.go
    - test/security/envelope_encoding.test.ts
    - agent/internal/protocol/testdata/envelope_vectors.json
  decisions: [2]
  acceptance_met: [1, 2, 3, 4]
  notes: |
    2026-08-04 — 2026-08-04 — THE SIGNATURE IS NOT OVER THE JSON, and that is the decision the task turns on. JSON is not a canonical encoding: key order, whitespace, escaping form and number formatting all vary, so two implementations signing 'the same object' produce different bytes, and every protocol that tried to fix this with a canonical-JSON profile produced a second specification to disagree about. The signature covers a length-prefixed binary encoding with one legal form per instruction; JSON stays the transport and the agent re-derives the canonical bytes from the fields it parsed. A JSON quirk therefore cannot survive — it lands as a signature mismatch, which is a refusal rather than a divergence.

    2026-08-04 — 2026-08-04 — Every field is length-prefixed because concatenation without lengths is ambiguous, and ambiguity in signed bytes is forgery: {a:'bc'} and {ab:'c'} both flatten to 'abc', so one signature would be valid for two different instructions. Asserted directly in the TypeScript suite rather than only pinned by a vector, because it is the property the encoding exists for. There is also a NUL-terminated domain separator carrying the version, so the same key cannot produce a signature valid in two contexts and a v2 envelope cannot be verified as v1.
    2026-08-04 — 2026-08-04 — Acceptance 2 is tested as an ORDER, not as a refusal. A test that only checks 'refused' passes for every possible ordering including the dangerous ones, so each case presents an envelope wrong in TWO ways and asserts which failure is reported: signature before arguments (else every regexp and length check in the agent is reachable without a key), signature before target (else an unauthenticated caller learns this host's identity by sending guesses), target before expiry (else a valid-but-misaddressed envelope leaks the host's clock offset, which is what aims a replay), expiry before nonce (else flooding dead envelopes exhausts the bounded store — asserted by checking the store is still EMPTY after an expired envelope is refused). Mutation-verified: moving the argument check above the signature fails the first case with the argument error quoted.
    2026-08-04 — 2026-08-04 — Cross-language agreement is proven by committed vectors both suites verify, not by review. Two independent implementations of a canonical encoding is exactly where both sides can be self-consistent and still disagree, and the failure would arrive on a host as 'the agent refuses every instruction', which reads as a transport problem. Six vectors chosen for what they distinguish: argument-order fails if either side iterates a map instead of sorting; ambiguous-concatenation pins the length prefixes; multibyte-content fails if either side counts characters instead of bytes. Mutation-verified: dropping one length prefix in Go named the differing byte offset. The vector file IS the drift check — no second mechanism to keep current.
    2026-08-04 — 2026-08-04 — The key_id hint does NOT select the verification key. It is attacker-controlled, so letting it choose would mean naming a revoked key is enough to have it used, which is the whole of the vulnerability rotation exists to close. Every accepted key is tried, which also makes the refusal constant in the number of keys so timing cannot reveal which key a host holds. An agent holding no keys refuses explicitly rather than falling through an empty range.
    2026-08-04 — 2026-08-04 — A real design defect the tests found: FileNonceStore called time.Now() internally while Verify takes an injected clock, so the two could disagree invisibly. The restart test failed because the store pruned against wall-clock time while the vectors carry fixed stamps — a symptom identical to the nonce never having been written. The clock is now injected. A hidden clock inside a security check is a hidden assumption about when that check applies. Also caught: my forgery helper flipped the LAST base64 character, which on a 64-byte signature is the '=' pad, so three tests got ErrMalformed where they asserted ErrBadSignature — a forgery test producing unparseable input is not testing forgery.
    2026-08-04 — 2026-08-04 — The agent enforces MaxValidity itself rather than trusting the signer. A signed envelope claiming a one-year window would otherwise require a one-year nonce store, so how much replay memory a host holds would be decided by whoever signs instead of by the host. The store refuses when full rather than evicting: evicting the oldest would forget a nonce that is still live, letting an attacker who can flood choose which nonce gets forgotten. Refusing is a denial of service; evicting is a security failure dressed as availability.
- id: RL-M2-004
  title: Manage the control plane instruction signing key
  milestone: M2
  status: done
  owner: agent
  estimate: M
  depends_on: [RL-M2-003]
  blocks: [RL-M2-005]
  risk: high
  started_at: 2026-08-04
  done_at: 2026-08-04
  acceptance:
    - The signing key is generated on first run and never has a default
    - It is stored separately from the database with restrictive permissions
    - Rotation is supported with an overlap window so agents accept both keys during rollover
    - A test confirms an envelope signed by an unknown key is refused
  artifacts:
    - test/security/instruction_key_rotation.test.ts
  decisions: [2, 6]
  acceptance_met: [1, 2, 3, 4]
  notes: |
    2026-08-04 — 2026-08-04 — ROTATION LANDED. Three files: instruction-signing.pem is what signs now, instruction-signing.previous.pem is the outgoing key present only during an overlap, and instruction-signing.rotated-at records when. The deadline is derived from that stamp and NOT from the previous key's mtime — an mtime does not survive a copy, a restore, or a container rebuild, and every one of those would silently move the deadline in the direction of accepting a retired key for longer. A timestamp the rotation wrote is a fact; an mtime is an artefact of the filesystem.

    2026-08-04 — 2026-08-04 — THE OVERLAP MUST OUTLAST AN ENVELOPE, and that is enforced rather than documented. An envelope signed one millisecond before rotation is valid for up to MAX_VALIDITY_MS afterwards, so an overlap shorter than that would have an instruction already signed and already sent refused partway through its own validity window — and the operator would see a deploy fail for a reason nothing in the logs connects to a key change. rotateInstructionKey refuses an overlap below MIN_OVERLAP_MS, and a test asserts MIN_OVERLAP_MS equals MAX_VALIDITY_MS, which is what actually stops the two constants drifting across module boundaries.
    2026-08-04 — 2026-08-04 — Three refusals that each prevent a different failure. A SECOND rotation during an open overlap is refused, because chaining would leave three keys able to sign an instruction to every host and each extra accepted key is another one an attacker only has to obtain one of. PRUNING during an open overlap is refused, because an agent that has not learned the current key would have nothing it accepts and no recovery but re-enrolment — --force exists for an operator who knows every host is current, and is a flag rather than the default because being wrong bricks every agent that was behind. And a STALE previous file with a closed window is not accepted: both the file and the deadline are checked, not either, because a leftover file would otherwise extend acceptance indefinitely through a cleanup that never ran.
    2026-08-04 — 2026-08-04 — The write order is deliberate and the reverse of convenient: outgoing key MOVED to its slot first, then the new key written, then the stamp. There is no instant where the current key is replaced and the outgoing one is not yet recoverable, and a crash between steps leaves no stamp — which acceptedInstructionKeys reads as no overlap, so the installation refuses rather than accepting a key it cannot account for. A loud failure needing an operator is the right outcome for a half-completed key rotation.
    2026-08-04 — 2026-08-04 — Acceptance 4's specific gap is now covered. The agent suite already proved a FORGED signature is refused; what nothing covered was an envelope CORRECTLY SIGNED by a key the agent does not hold, which is a different claim and the one that fails if verification ever falls back to key material the envelope carries. The test builds a real signature over real canonical bytes with a stranger's key and asserts that key is in neither slot, so the only thing between it and acceptance is the key set itself. Mutation-verified two ways: accepting previous regardless of the deadline fails two tests, and replacing the key instead of moving it fails fifteen.
    2026-08-04 — 2026-08-04 — Rotation is an OPERATOR ACTION via ./scripts/keys, not an API endpoint, and that is a decision. An endpoint would let anyone reaching the dashboard replace the key authorising every instruction to every host, so the authority is the same as for claiming an installation: shell access to the machine holding the key. No key material is ever printed — status shows a sha256 fingerprint of the PUBLIC key, which discloses nothing that key was not already public for, and is what an operator compares against what an agent reports.
- id: RL-M2-005
  title: Implement agent enrolment and mutual transport authentication
  milestone: M2
  status: done
  owner: agent
  estimate: L
  depends_on: [RL-M2-004]
  blocks: [RL-M2-006, RL-M2-010]
  risk: high
  started_at: 2026-08-04
  done_at: 2026-08-04
  acceptance:
    - Each host registers its own Ed25519 signing key at enrolment
    - Keys are individually revocable and revocation takes effect on next connection
    - "A connection presenting no proof, or a proof under a revoked key, is refused"
    - The enrolment token is single use and short lived
    - A signature for one connection does not authenticate another
  artifacts:
    - test/security/host_identity.test.ts
    - agent/internal/protocol/identity_security_test.go
  decisions: [2]
  notes: |
    2026-08-04 — 2026-08-04 — A WRONG TURN WORTH RECORDING. Node's stdlib can PARSE and VERIFY X.509 (X509Certificate.verify, checkIssued) and cannot MINT it — there is no certificate-building API. My first design used OpenSSL through execFile with an argv array, reasoning that C2 forbids shell commands built by string interpolation and an argv array is exactly what C2 asks for. THE LINT RULE REFUSED IT, AND THE LINT RULE IS RIGHT: ADR 0005 and C2 together say the control plane executes NO processes, 'that is what makes command injection structurally impossible here rather than merely unlikely', and an argv array in one file is still a process-spawning import under src/. A constraint that holds only where somebody remembered to hold it is not a constraint. Hand-rolling ASN.1 DER was the other stdlib option and is worse: getting ASN.1 wrong is a classic source of certificate-confusion bugs, and a bespoke encoder written once and never fuzzed is the kind of thing that is subtly wrong for years.

    2026-08-04 — 2026-08-04 — DEPENDENCY ADDED: @peculiar/x509, for minting only. §6.7 prefers the standard library rather than forbidding anything else, and a library does not violate C2 — the constraint is about spawning processes, not about code. Minting will live in src/crypto/issue.ts, SEPARATE from src/crypto/ca.ts which verifies: verification runs on every connection and must not depend on a library that could throw on load, because that would decide whether any host may connect. Minting happens once per host with an operator present.
    2026-08-04 — 2026-08-04 — DONE AND VERIFIED: migration 14 cycles up, down, up cleanly. Three tables rather than one, and the split is deliberate. hosts outlives any certificate, because rotating a host's certificate must not look like a different host. host_certificates is one issued certificate and a host has many over its life, so folding it into hosts would lose the history an incident needs — 'which certificate signed the connection that ran this operation' is a question that gets asked. host_enrolments holds a SHA-256 of the token, never the token: a token in the database is a credential readable by every backup, every replica and every pg_dump in somebody's downloads folder.
    2026-08-04 — 2026-08-04 — REVOCATION IS A COLUMN, NOT A CRL, and that is what makes acceptance 2 true. A CRL takes effect whenever the list is next distributed and parsed — a weaker guarantee that fails silently when distribution fails. The control plane already reads the database to accept a connection, so a column there is simpler AND strictly stronger: no window, nothing to distribute. Two partial unique indexes enforce the properties code alone would race on: at most one UNSPENT enrolment per host (two live tokens would let two parties each enrol it, and the loser is a host that was enrolled then locked out with nothing recording why) and at most one UNREVOKED certificate per host (two live certificates make revoking one pointless, which is the opposite of 'individually revocable' being useful).
    2026-08-04 — 2026-08-04 — NOT DONE. src/crypto/ca.ts has the stdlib verification half: issued-by-us checked with BOTH checkIssued and verify (checkIssued alone only says the names line up, and anybody can put our CA's name in their issuer field), validity window on both sides, a refusal for a CA certificate presented as a client one, and the CN read as the host id so a verified connection names a row without a lookup. Still needed: src/crypto/issue.ts using @peculiar/x509, src/repo/enrolment.ts for mint/spend/revoke, the clientAuth-only extension on issued certificates so one cannot impersonate the control plane to another agent, and test/security/agent_enrolment_test.go. No acceptance is checked yet.
    2026-08-04 — 2026-08-04 — UNRELATED SECURITY FINDING, fixed while here: npm audit reported hono <4.12.34 has a ReDoS advisory in its CORS middleware (GHSA-8j4g-w8fx-2239) and package.json pinned ^4.12.33. Not exploitable — nothing imports the CORS middleware — but bumped to ^4.13.0, now 0 vulnerabilities. Worth a task of its own: CI has no dependency-audit step, so this was found by hand and only because I happened to install something.
    2026-08-04 — 2026-08-04 — DEPENDENCY BACKED OUT, and the reason is a §2.10 hard-constraint conflict I cannot resolve alone. @peculiar/x509 was installed, then removed: it pulls 15 transitive packages including tsyringe, a dependency-injection container, and it requires a GLOBAL 'import reflect-metadata' polyfill at the process entry point or it throws on load. A DI framework and a global prototype-patching polyfill in the supply chain of the key that authorises every instruction to every host is a worse trade than the problem it solves, and §6.7 prefers the standard library.
    2026-08-04 — 2026-08-04 — THE CONFLICT, stated so it can be ruled on. Three things the brief and the ADRs all assert, any two of which are satisfiable: (a) ADR 0002 — the agent authenticates with a per-host X.509 CLIENT CERTIFICATE over mutual TLS; (b) ADR 0005 and C2 — the control plane executes NO processes, enforced by a lint rule that forbids importing child_process anywhere under src/; (c) §6.7 — prefer the standard library. Node's crypto can verify X.509 and cannot mint it, so (a) requires either a process (violating b) or a dependency (straining c, and the available one is heavy enough to be its own risk). Hand-rolled ASN.1 satisfies b and c and is the worst option for security-critical code.
    2026-08-04 — 2026-08-04 — FOUR RESOLUTIONS, with my reading of each. (1) Accept a minting dependency and audit it properly — the honest version of what I tried, and it needs a decision about reflect-metadata being loaded globally in the control plane. (2) Mint in Go: crypto/x509.CreateCertificate is stdlib, the agent module already exists, and a 'ratline-ca' subcommand could sign — but the control plane would have to invoke it, which is (b) again. (3) Amend ADR 0002 so the transport authenticates with an Ed25519 challenge-response rather than a client certificate: mintable entirely in Node's stdlib, and the agent already verifies Ed25519 for envelopes so the primitive is present. Loses standard mTLS tooling and terminating proxies that expect client certs. (4) Narrow the lint rule to permit ONE audited process-spawning module — my least favourite, because the rule's value is that it has no exceptions. MY RECOMMENDATION IS (3), but ADR 0002's mechanism is the owner's to change, not mine, and acceptance 1 of this task says 'client certificate' in as many words.
    2026-08-04 — 2026-08-04 — WHAT IS DONE AND VERIFIED regardless of which way the above goes: migration 14 cycles up/down/up cleanly, and src/crypto/ca.ts holds the VERIFICATION half in pure stdlib — issued-by-us checked with both checkIssued and verify, validity window on both sides, a CA certificate refused when presented as a client one, and the CN read as the host id. That code survives resolutions 1, 2 and 4 unchanged, and only resolution 3 would replace it. The schema survives all four: hosts, host_enrolments with a hashed single-use token, and host_certificates with revocation as a column.
    2026-08-04 — 2026-08-04 — RULED: option 3 (A-04). ADR 0002's transport mechanism is amended — the agent proves itself with an Ed25519 signature over a challenge rather than an X.509 client certificate — and the ADR stays 'proposed', because §2.6 reserves acceptance for the owner and a ruling on one mechanism inside an ADR is not acceptance of the ADR. ACCEPTANCE CRITERIA REWRITTEN to describe the mechanism the owner chose, and a fifth added for the property the certificate gave for free. Recorded here so the difference between applying a ruling and moving a goalpost is visible: I refused to change acceptance 1 myself two notes ago, and it is changed now because the owner changed the mechanism it described.
    2026-08-04 — 2026-08-04 — TWO PROPERTIES A CERTIFICATE GAVE FOR FREE, now supplied explicitly, and they are the first two tests in the suite because they are the whole reason the amendment needed one. (1) BINDING TO THE CONNECTION: a signature over a challenge is a bearer token once it exists, so the challenge is issued per connection, held only in that connection's memory, and consumed on first use — a signature answering one cannot answer another, because the second's nonce is a different random value the first signature does not cover. That is server-side channel binding and it is stronger here than a TLS exporter, which would need two TLS stacks to agree on which RFC they implement. (2) DOMAIN SEPARATION: ratline-host-identity-v1, distinct from ratline-instruction-v1, so a host's signed challenge is not an instruction and an instruction is not a proof of identity. The two keys are different keys today, and 'different keys today' is a property of current code rather than of the format.
    2026-08-04 — 2026-08-04 — Verification order matters and is asserted. Expiry first, because checking a signature against an expired challenge is work an unauthenticated party can ask for. Then the nonce, compared in CONSTANT TIME — a byte-by-byte comparison with early exit leaks how much of a guess was right, which is the whole game when the nonce is the only thing between a captured signature and a second use. Then revocation, BEFORE the signature: a revoked host's signature is never examined, and refusing later would leak by timing whether it was well-formed, which tells an attacker holding a stolen key that the key was once real. Then the signature. Mutation-verified three ways: dropping the nonce check fails the replay test, reusing the instruction domain fails the separation test, and moving revocation after the signature fails the revocation test.
    2026-08-04 — 2026-08-04 — SCHEMA RENAMED to match the mechanism: host_certificates became host_keys, holding an SPKI public key rather than a certificate. Migration 14 is not merged, so it was amended rather than stacked. A public key is a smaller thing to hold than a certificate — no validity window of its own to expire wrongly, no issuer chain to verify, no extensions to misread — and what the certificate carried implicitly is now expires_at, explicit and enforced in one place. src/crypto/ca.ts is deleted: it verified X.509, and there is no X.509 any more. Cycles up/down/up cleanly. A local down-migration failure while renaming was stale state rather than a bug — the database still held host_certificates from the pre-rename run, so the new down dropped a table that was not there and the old one blocked dropping hosts.
    2026-08-04 — 2026-08-04 — STILL OPEN: src/repo/enrolment.ts for mint/spend/register/revoke against the schema, the HTTP surface for enrolment and for the challenge exchange, and the Go half so the agent can answer a challenge. No acceptance is checked — every property above is tested at the crypto layer and nothing yet stores a key or serves a connection.
    2026-08-04 — 2026-08-04 — REPOSITORY LAYER DONE, and C3's gate caught all three ungated functions on the first run rather than my noticing them. redeemEnrolment, registeredKeyFor and recordHostSeen resolve no permission because each runs before there is an actor, and each now carries a written argument on the exemption list that the test enforces a minimum length on. The arguments are not interchangeable: redeemEnrolment has the token standing in for a permission, registeredKeyFor is limited by its SHAPE (it takes a fingerprint and returns the one row matching it — there is no variant that lists keys or accepts a host id, and a caller holding a fingerprint already holds the key it hashes), and recordHostSeen acts for the host that just authenticated and writes an address OBSERVED on the connection rather than one anybody sent.
    2026-08-04 — 2026-08-04 — TWO THINGS THE DATABASE ENFORCES RATHER THAN THE CODE. redeemEnrolment is a CONDITIONAL UPDATE with 'where spent_at is null' inside the statement, not a select followed by a write: two agents presenting the same token concurrently cannot both succeed, because one updates a row and the other updates none. A read-then-write has a window and both would win it. And the refusal is ONE message for every reason — unknown token, already spent, expired, wrong tenant — because distinguishing them tells whoever is guessing which guesses are getting warmer. registeredKeyFor deliberately returns a REVOKED key rather than null, so the connection handler can record which refusal happened; returning null would make 'revoked' and 'never existed' the same answer.
    2026-08-04 — 2026-08-04 — THE AGENT'S HALF, with the same cross-language arrangement as the envelope. agent/internal/protocol/identity.go signs a challenge; three committed vectors generated by the TypeScript side are verified by the Go side, so two self-consistent implementations cannot disagree silently — the failure would otherwise arrive on a host as 'the agent cannot authenticate', which reads as a network problem rather than an encoding one. Mutation-verified: dropping the host-id length prefix in Go fails eight tests, and the failure names the differing byte offset. The agent refuses a malformed challenge rather than signing it: signing whatever arrived would also be safe, since a signature over the wrong bytes simply fails, but refusing early means a control plane that changed format produces a clear local error instead of an authentication failure indistinguishable from a revoked key. Upper-case hex is refused for the same reason two encodings of one nonce would be two nonces.
    2026-08-04 — 2026-08-04 — STILL OPEN: the HTTP surface. Enrolment and the challenge exchange need routes in src/api/routes.ts and handlers bound in server.ts, and until they exist nothing serves a connection — so acceptance 3 ('a connection presenting no proof, or a proof under a revoked key, is refused') is proven at the crypto and repository layers and not yet over the wire. That is the same position RL-M1-042 left the transport layer in, and the authorization matrix will report it honestly as a decision-layer cell rather than a transport one.
    2026-08-04 — 2026-08-04 — ACCEPTANCE 3 UNCHECKED, correcting my own over-claim two notes ago. It says 'a CONNECTION presenting no proof, or a proof under a revoked key, is refused', and there is no connection handler — nothing in src/api serves enrolment or the challenge exchange. What is proven is that verifyChallenge refuses a revoked key before examining its signature and that registeredKeyFor returns the revocation rather than hiding it, which is the decision layer. The transport layer is empty, and RL-M1-042's honesty about exactly this is the precedent: the authorization matrix reports a decision-layer cell as a decision-layer cell rather than counting it as end-to-end. The other four are met.
    2026-08-04 — 2026-08-04 — HTTP SURFACE DONE. Six routes: GET/POST /hosts and POST /hosts/:hostId/revoke-key guarded by host.read, host.create and host.update; POST /agent/enrol, /agent/challenge and /agent/authenticate public, each with a written publicReason because the caller is establishing who it is and there is no actor yet to check — the same structural reason /auth/sign-in is public. The route table is now 36 routes, 27 guarded, and transport coverage rose from 12 bound of 30 to 18 of 36.
    2026-08-04 — 2026-08-04 — THE AUTHORIZATION MATRIX CAUGHT A REAL ORDERING BUG in my own handler, which is the best thing that happened today. POST /hosts validated the request body BEFORE resolving the permission, so four roles without host.create got 400 instead of a refusal and the matrix read them as ALLOWED. It is the same shape the instruction envelope is arranged against: validating before authorising hands an unauthorised caller the whole validation surface, and here it would let any member of a tenant probe the request schema of a route they cannot use. Fixed by coercing the name to '' and letting enrolHost resolve host.create first and refuse an empty name second — which puts the order right without a second check to forget.
    2026-08-04 — 2026-08-04 — indistinguishable_404's scan ALSO caught me: I hand-wrote json({error:'authentication failed'}, 401) in three places, which is a second refusal shape and §6.3 wants exactly one. Routed through unauthenticated() instead, which has the further effect that 'no challenge in flight', 'unknown fingerprint' and 'bad signature' are now the same bytes — they must be, or probing tells an attacker which handles and hosts are real. The REASON is audited and not returned: an operator needs to know a revoked host tried to connect, and the host does not need to know why it failed.
    2026-08-04 — 2026-08-04 — THE CHALLENGE STORE, and the limitation it carries. Over HTTP there is no connection to bind a signature to — request and response are separate exchanges — so the challenge lives in memory keyed by an opaque handle and is TAKEN rather than read: single use is what makes an answer unrepeatable, and a read that left the entry behind would need every caller to remember to delete it. THE LIMITATION, stated rather than discovered: this is one process's memory, so a control plane behind a load balancer would issue in one process and receive the answer in another, and the agent would see intermittent failures that look like a revoked key. Ratline calls serve() once today, so it is true rather than assumed. The way out is a control-plane-SIGNED challenge needing no server state, which then needs its own replay store — the same problem moved rather than solved, recorded for the day a second process arrives.
    2026-08-04 — 2026-08-04 — The store is BOUNDED because an unauthenticated caller can reach /agent/challenge: if issuing one allocated memory nothing reclaimed, asking repeatedly would be the cheapest possible denial of service against the control plane, needing no credential at all. It refuses rather than evicting, for the reason the agent's nonce store does — evicting the oldest lets a flood choose which legitimate agent's challenge is forgotten, turning a denial of service into an authentication failure somebody has to diagnose. A full store answers 503 rather than 429: it is a capacity condition, and 429 would tell an honest agent to back off when the problem is somebody else.
    2026-08-04 — 2026-08-04 — ACCEPTANCE 3 NOW CHECKED, and honestly split. Over the wire: a request with no proof, a nonsense handle, or a well-formed answer to a handle that was never issued are all refused, and the test asserts the response does NOT say which — no 'revoked', no 'expired', no 'unknown host', no 'no challenge'. At the decision layer: a proof under a revoked key is refused before its signature is examined. The revoked half is not driven over HTTP because it needs a registered key and therefore a database, and the test says so where it would otherwise be blurred. 652/652 tests, matrix 756/756 cells with 77 verified end to end.
