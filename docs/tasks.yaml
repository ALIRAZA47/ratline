    2026-08-01 — Closes the truncation gap RL-M1-014 recorded. A hash chain provably cannot detect removal of its own head — the evidence is the part that was deleted — so each run records the head it saw in a separate append-only table, and the next run refuses a head that moved backwards. That does not make truncation impossible, but it turns a silent deletion into a loud contradiction.
