# Ratline — work items. Source of truth. See docs/BRIEF.md §2.2 for the schema.
#
# Written in the YAML subset documented at the top of scripts/tasks.ts.
# `./scripts/tasks validate` runs in CI; a malformed tracker fails the build.
#
# Conventions used here:
#   - `depends_on` is authored by hand; `blocks` is derived (`tasks sync-blocks`).
#   - `acceptance_met` holds the 1-based indices of satisfied acceptance lines.
#   - `risk: high` marks anything touching authorization, secrets, remote
#     execution or TLS. Such a task cannot be closed without naming a
#     security-suite artifact.
#   - IDs are immutable and never reused. Dropped work stays, with a note.

