    2026-08-03 — So M2 is genuinely blocked, on one thing: a git remote (R-10). Every M2 task is transitively gated on RL-M1-002, RL-M1-002 needs CI to have executed once, and CI needs somewhere to run. The Go toolchain is installed and verified, the integration host is built and verified, the scaffold design is settled — the only missing input is the remote.
