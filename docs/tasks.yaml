# ===========================================================================
# M7 — Managed databases
#
# Requested as a scope change to brief §5.2, which lists managed databases as
# out of scope for v1. See ADR 0013.
#
# The ordering here is the design. Backup and tested restore (001-006) land
# BEFORE create and delete are exposed (010 onward), because a database is the
# one workload Ratline cannot reconstruct: a site comes back from git, a
# database does not come back at all. A half-managed database — installed but
# not recoverable — is more dangerous than an unmanaged one, because the
# operator believes it is covered.
# ===========================================================================

- id: RL-M7-001
  title: Re-examine the failure story for workloads that cannot be rebuilt
  milestone: M7
  status: todo
  owner: agent
  estimate: M
  depends_on: []
  blocks: [RL-M7-002]
  risk: high
  acceptance:
    - Every acceptance criterion in M2 to M4 that assumed a reconstructible workload is listed with its verdict
    - ADR 0009 build-on-host and ADR 0005 build containment are each re-argued against a stateful neighbour or amended
    - Anything that turns out to be unsafe for data hosts is recorded as a task rather than a caveat
  artifacts:
    - docs/decisions/0013-managed-database-engines.md
  decisions: [13]
  notes: |
    2026-08-02 — First task in the milestone on purpose. Chaos tests, rollback
    and provision-twice-idempotently were all written knowing a site can be
    rebuilt. None of that reasoning transfers unexamined to a database, and
    discovering which parts fail after the engines are installed is the wrong
    order.

- id: RL-M7-002
  title: Introduce host roles so data hosts refuse application workloads
  milestone: M7
  status: todo
  owner: agent
  estimate: M
  depends_on: [RL-M7-001]
  blocks: [RL-M7-003]
  risk: high
  acceptance:
    - A host declares whether it carries applications or data
    - Placing a site on a data host requires the same deliberate acknowledgement as a public bind
    - The interface states plainly why the two are separated
  artifacts:
    - test/security/host_role_separation.test.ts
  decisions: [13]
  notes: |
    2026-08-02 — ADR 0005 leaves user-authored build code running as the site
    user. On an application host the blast radius is other sites; on a data host
    it is the data itself. Separating them is the cheapest mitigation available
    and it has to exist before an engine is installed anywhere.

