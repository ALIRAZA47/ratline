    2026-08-03 — A full suite run went from roughly 75 seconds to 1,481,697 ms — about 25 minutes, a 20x regression — and it arrived with RL-M1-037. Introduced by me, in the same session, and recorded rather than left for somebody to discover as 'the tests are slow now'.

    2026-08-03 — MEASURED, not guessed. test/security/reauthentication.test.ts reports 205,449 ms for thirteen tests, and the per-test durations add up to about five seconds — the slowest is 879 ms. So the time is not in the tests. Two hundred seconds are spent after they finish, which is the signature of a handle keeping the process alive until something times out rather than of slow work.
    2026-08-03 — The likely mechanism, to be confirmed rather than assumed: require() now calls checkFreshness on every gated action, which opens a pooled connection through scoped(). connect() is a singleton that returns the existing pool and disconnect() clears it, so a freshness check reached after a disconnect would create a SECOND pool that nothing ever ends. token_subset.test.ts is the amplifier — it calls requirePermission once per action a role carries, which is over a hundred for Owner — and it went from fast to 14.4 seconds.
    2026-08-03 — Do NOT close this by raising a timeout or by forcing the process to exit. A pool that outlives its test is a pool that could outlive a request, and in production that is a connection leak rather than a slow suite. The third acceptance asks for something that FAILS on a leak, because this regression was invisible until a run happened to be timed.
