    2026-08-02 — Cookie policy is derived from the declared origins, never from the bind address, and the reasoning is R-11: a control plane on 127.0.0.1 behind a TLS-terminating proxy is the ordinary production shape and network.ts reports it contained, so 'loopback, therefore drop Secure' would hand the most exposed deployment the weakest cookie. Secure stays on unless RATLINE_ALLOW_INSECURE_COOKIES is set, mirroring RATLINE_ALLOW_PUBLIC_BIND.
