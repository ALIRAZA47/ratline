    - A signed-out visitor is sent to sign in rather than shown an empty shell
    - The C5 exposure warning is rendered in the interface and cannot be dismissed
    - Every fetch sends the CSRF token on unsafe methods, and a refusal is shown as a refusal
  artifacts: []
  decisions: []
  notes: |
    2026-08-04 — 2026-08-04 — FOUND BY OPENING IT IN A BROWSER, which nothing had done before RL-M1-057 served it. The shell renders correctly — rail, breadcrumb, the PRODUCTION chip in its reserved hue, the palette affordance, the tension line — and the network log shows it fetching its own HTML, JS, CSS and fonts and making ZERO API calls. 'marketing-www' in the breadcrumb is placeholder text inside the component, not a site that exists. RL-M1-022 built the shell as chrome and the data layer was never added, so the rail items lead nowhere. That is honest for what M1 scoped, and it means the dashboard currently looks more finished than it is — which is the specific risk of serving it: a screenshot of this would misrepresent the state of the product.

    2026-08-04 — 2026-08-04 — Acceptance 3 here is inherited from RL-M1-057, which left it unmet: C5 asks for a loud non-dismissable warning in the DASHBOARD and the warning currently only reaches stderr. An operator who opened a browser and never read the container logs would see nothing. src/web/lib/shell/ already models the tension states and RL-M1-023 built the exposure text, so this is wiring rather than design.
    2026-08-04 — 2026-08-04 — ACCEPTANCES 2 AND 3 MET AND VERIFIED IN A BROWSER, which is the first time any of this was looked at. Signed out, the root now renders the sign-in form with 'This installation is already set up' — so Entry asked the server and chose sign-in over claim rather than us guessing. Signing in with the real owner credentials produced a session and the shell, with the rail marking Audit active and NO marketing-www placeholder anywhere. The C5 exposure banner renders above everything, carries its own caveat about NAT and reverse proxies, and has no dismiss control at all: no button, no close icon, no local-storage key, because each of those is something somebody clicks once and never sees again.
    2026-08-04 — 2026-08-04 — The banner is injected into the served HTML rather than fetched, and that placement is the decision. C5 wants a warning that cannot be dismissed, so it has to survive the two cases a fetch would not: before anyone signs in, and when the API is failing. A warning that needs a working session to appear is absent exactly when somebody is most likely to be poking at an exposed dashboard. It is also set in the asset MAP as well as the fallback, because assetFor returns the map entry for an exact path — so a browser asking for /index.html directly would otherwise get the copy without the warning, which is the one case where it silently disappears.
    2026-08-04 — 2026-08-04 — The probe is GET /organization, not a dedicated /session endpoint, deliberately. A session endpoint would be a second source of truth about authorization, and one saying 'you are signed in' while the endpoint you actually need refuses you is worse than no answer — the interface would then show a shell it cannot fill. organization.read is held by all seven roles, so a 200 means there is a session AND it can do the minimum. A 404 is treated as signed-out rather than investigated, because §6.3 makes unauthorized and nonexistent indistinguishable on purpose and the dashboard must not try to guess which.
    2026-08-04 — 2026-08-04 — 'unreachable' is a THIRD state, not folded into signed-out, and this is the one design decision here I would defend hardest. Rendering a sign-in form when the server cannot be reached invites an operator to type a password into a page that cannot deliver it — which is how a transient outage becomes a credential typed into something unknown. It renders an explicit failure naming what broke instead.
    2026-08-04 — 2026-08-04 — ACCEPTANCES 1 AND 4 NOT MET, left unchecked. The placeholder data is gone and the organization name is real, but Shell has no content components behind the rail: the panes are empty because RL-M1-022 built chrome and no screen was ever written. So 'each rail destination shows data the API returned' is half true — the frame is real and there is nothing in it. And acceptance 4 is untested: sign-in is a public route needing no CSRF token, so nothing here has yet sent one on a guarded mutation. Both need screens to exist first. Also recorded: the environment chip is hardcoded to production because no endpoint reports which environment an installation is — defaulted that way because the chip reserves its hue for production, so being wrong in this direction over-warns rather than under-warns.
    2026-08-04 — 2026-08-04 — Acceptance 1 now met by RL-M1-059, which wrote the screens. Acceptance 4 (CSRF on unsafe methods) remains unmet: every screen so far is a read, so nothing has yet sent a token on a guarded mutation. It becomes testable when the first write lands.
