    2026-08-01 — The database computes the hash, not the application. A chain computed by the thing being audited proves nothing — an attacker owning the application writes whatever entries it likes and recomputes the chain over them, and it verifies perfectly. In a trigger, forging history needs the database role too, and the application role holds no UPDATE or DELETE.

    2026-08-01 — The chain is per organization. Row-level security means a tenant sees only its own rows, so a single global chain would be unverifiable by anyone but a superuser — every tenant would hold a chain full of holes with no way to tell a redaction from a policy.
