    2026-08-04 — 2026-08-04 — Found by accident, which is the point. npm audit reported hono <4.12.34 carries a ReDoS advisory in its CORS middleware (GHSA-8j4g-w8fx-2239) and package.json pinned ^4.12.33. Not exploitable here — nothing imports that middleware — and bumped to ^4.13.0. But nothing in CI would have told anyone: the pipeline lints, typechecks, tests, migrates and builds the agent, and never once asks whether a dependency has a known hole. I only saw it because I happened to install something else. Acceptance 2 splits production from development advisories deliberately: failing the build on a devDependency advisory trains people to ignore the check, and a check people ignore is worse than none.

