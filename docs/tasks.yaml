  notes: |
    2026-08-02 — Raised by ADR 0018 / R-26. The 2FA work deliberately shipped WITHOUT this: turning off anybody's second factor is the most dangerous capability in the feature and the catalogue had no action to check an administrator against, so src/repo/two_factor.ts refuses to write anyone else's enrolment at all. That is the same answer updatePasswordHash gave before RL-M1-034 catalogued member.reset_password, and it wants the same treatment.
    2026-08-02 — The most dangerous capability in the two-factor feature, and the reason is precise: R-17 is closed 'as far as a password alone permits' BECAUSE the second factor stands — an operator who resets a password still cannot sign in as that person. This removes that bound. Whoever holds both can take an account outright, so the two are held by the same two roles and a test asserts they move together in BOTH directions. Splitting them would suggest the pair is safer than either, and it is the opposite.
    2026-08-02 — Enrolments AND recovery codes go, in one transaction. Leaving the codes would leave live credentials for a factor that no longer exists — the same reasoning confirmEnrolment already applies when it replaces a secret.
    2026-08-02 — Ordering: the clear goes FIRST, because the clear is where the permission is resolved. This is the RL-M1-034 lesson applied rather than relearned — revoking first would let an Infrastructure operator, who holds member.revoke_sessions and not this, end a member's sessions on the way to being refused. Mutation testing confirmed: restoring the revoke-first order fails four refusal tests.
    2026-08-02 — Acceptance 3 needed no new forcing code and the test proves that rather than assuming it: with no confirmed enrolment, signIn consults the organization's requirement and issues an ENROLMENT challenge on its own. What was worth testing is that clearing actually reaches that state instead of leaving a stale row that still counts.
    2026-08-02 — A fixture surprise worth recording: the subject could not be signed in to get a live session, because a member WITH a confirmed factor cannot reach one from a password alone — that is RL-M1-019 working. The session is minted directly from the schema instead, and the test says why, since 'reaching past the auth layer' otherwise reads as laziness.
